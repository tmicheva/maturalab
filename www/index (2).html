<style>
/* Layout: mobile app shell — sticky header, one view at a time, fixed bottom tab bar; graph-paper ground from exam notebooks + ledger mono numbers */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#18233D; --muted:#5B6782; --line:#D9E0EB; --grid:rgba(47,91,211,.07);
  --accent:#2F5BD3; --accent-soft:#E3EAFB; --ledger:#17805A; --ledger-soft:#E1F3EB;
  --good:#17805A; --bad:#C4372F; --bad-soft:#FBE7E5; --warn:#A86A00;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1524; --surface:#172036; --ink:#E6EBF5; --muted:#9AA6C0; --line:#28334D; --grid:rgba(130,160,240,.06);
  --accent:#7D9BF0; --accent-soft:#1F2C4D; --ledger:#4CC596; --ledger-soft:#14302A;
  --good:#4CC596; --bad:#F07A70; --bad-soft:#3A1E1E; --warn:#E3A93A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#172036; --ink:#E6EBF5; --muted:#9AA6C0; --line:#28334D; --grid:rgba(130,160,240,.06);
  --accent:#7D9BF0; --accent-soft:#1F2C4D; --ledger:#4CC596; --ledger-soft:#14302A;
  --good:#4CC596; --bad:#F07A70; --bad-soft:#3A1E1E; --warn:#E3A93A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.stem{display:flex;gap:4px}
.stem b{font-family:var(--f-mono);font-size:11px;font-weight:500;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.stem b.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
main{flex:1;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:9px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}

/* STEM map on home */
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map div{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.map .l{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent)}
.map .t{font-weight:600;font-size:13px}
.map .d{font-size:12.5px;color:var(--muted)}
.starts{display:grid;gap:8px}
.start{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.start strong{display:block;font-weight:600}
.start small{color:var(--muted)}
.start .go{font-family:var(--f-mono);color:var(--accent)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.led{background:var(--ledger-soft);color:var(--ledger)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:16.5px;font-weight:500}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.opt .k{font-family:var(--f-mono);color:var(--muted);flex:none}
.opt.ok{border-color:var(--good);background:var(--ledger-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{font-size:14px;border-radius:10px;padding:12px;background:var(--accent-soft)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
input[type=text],input[type=number],select,textarea{box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:240px;resize:vertical;line-height:1.6}

/* ledger */
.ledger{font-family:var(--f-mono);font-size:13px}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.entry label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-family:var(--f-body);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.entry .amt{grid-column:1/-1}
.entry.ok{border-style:solid;border-color:var(--good)} .entry.no{border-style:solid;border-color:var(--bad)}
.tacc{overflow-x:auto}
.tacc table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.tacc th,.tacc td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tacc td.n{text-align:right}
.tacc th{font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.res{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.res b{color:var(--ledger)}

/* essay */
.topics{display:grid;gap:8px}
.topic{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.topic[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.topic small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.checks{display:grid;gap:6px}
.checks{gap:10px}.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px}.checks input{margin-top:4px;flex:none}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.para{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.para.r-intro{border-left-color:var(--accent)} .para.r-arg{border-left-color:var(--ledger)} .para.r-concl{border-left-color:var(--warn)}
.para select{width:auto;flex:1 1 140px}
.ptext{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.chk{display:flex;gap:6px;align-items:center;font-size:13.5px}
.rep{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.rep li::before{content:"✓ ";color:var(--good);font-weight:700} .rep li.b::before{content:"✗ ";color:var(--bad)}
.metric{border-left:3px solid var(--line);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.metric.g{border-left-color:var(--good)} .metric.b{border-left-color:var(--bad)} .metric.w{border-left-color:var(--warn)}
.metric span{color:var(--muted)}
mark{background:var(--accent-soft);color:var(--ink);border-bottom:2px solid var(--accent);padding:0 1px}
.stext{font-size:14.5px;line-height:1.6}
.sex{font-size:12.5px;font-weight:600;color:var(--ledger)}
.snote{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.steps{margin:0;padding-left:20px;display:grid;gap:3px;font-size:14px}
a.btn{text-decoration:none;display:inline-block}
.tacc td.lo{color:var(--bad);font-weight:600}
.mini{font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.mini.dng{color:var(--bad)} .mini:focus-visible,.segb:focus-visible,label.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.segb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.erow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.et{min-width:0;flex:1 1 200px;font-size:14px;overflow-wrap:anywhere}
.et .pill{margin-right:4px}
.mono{font-family:var(--f-mono);font-weight:500;margin-right:6px}
.eform{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);border-radius:10px;padding:14px;background:var(--accent-soft)}
.eform input,.eform select,.eform textarea{background:var(--surface)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
.fl input,.fl select,.fl textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px}
div.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.sm{min-height:70px}
.ferr{color:var(--bad);font-size:14px;font-weight:500}
label.btn{display:inline-block}
.pill.warn{background:var(--bad-soft);color:var(--warn);display:inline-block;margin-top:4px}
.erow.imp.bad .et{color:var(--muted)}
.eform.ie{margin-bottom:6px}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.passage summary{font-weight:600;color:var(--accent);cursor:pointer}
.ptx{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:15px;line-height:1.65;max-height:55vh;overflow-y:auto;overflow-wrap:anywhere}
textarea.oans{min-height:150px}
table.fill input{width:9em;text-align:right;font-family:var(--f-mono)}
table.fill tr.ok td{background:var(--ledger-soft)} table.fill tr.no td{background:var(--bad-soft)}
.skt td{vertical-align:middle}
.sbar{display:inline-block;vertical-align:middle;width:80px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-right:8px}
.sbar i{display:block;height:100%;background:var(--warn)}
.sv{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.kref{display:inline-block;margin-top:8px;font-weight:600;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}
.kref:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filt{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-inline:-2px;scrollbar-width:thin}
.filt .segb{flex:none;white-space:nowrap}
.filt.sub .segb{font-size:12.5px;padding:4px 10px}
.segb.led[aria-pressed="true"]{background:var(--ledger);border-color:var(--ledger)}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{font:inherit;font-size:11.5px;font-weight:500;color:var(--muted);background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab[aria-current="page"]{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- данни (примерни — заменят се със собствени материали) ---------- */
let BEL=[
 {topic:"Четене с разбиране",passage:"Библиотеката в малкия град отвори врати отново след двугодишен ремонт. Освен книги, тя вече предлага зала за дигитални умения, където възрастни хора се учат да ползват електронни услуги, а ученици подготвят проекти.\n\nДиректорката казва, че броят на читателите е нараснал с една трета само за първия месец. „Хората идват не само за книги, а за среща с другите“, обяснява тя.",q:"Коя е основната мисъл на текста?",opts:["Ремонтът на библиотеката е продължил твърде дълго.","Обновената библиотека се е превърнала в място за учене и общуване.","Възрастните хора не умеят да ползват електронни услуги.","Учениците предпочитат дигиталните книги."],a:1,exp:"Текстът описва новите дейности и думите на директорката – библиотеката събира хората, за да учат и да общуват."},
 {topic:"Литература",type:"open",q:"Обяснете в 4–5 изречения как заглавието „Под игото“ е свързано с основния проблем в романа на Иван Вазов.",model:"Заглавието назовава състоянието на българите под османска власт – живот в несвобода. Романът показва как в това състояние се ражда стремежът към свобода и подготовката на Априлското въстание. Игото е не само политическо, но и душевно – страхът и примирението. Герои като Огнянов и Соколов показват, че човек може да се освободи от това вътрешно иго. Така заглавието обобщава централния конфликт: робство срещу копнеж по свобода.",criteria:["Обяснява „иго“ като несвобода","Свързва заглавието с подготовката на въстанието","Посочва поне един герой или епизод като пример","4–5 изречения без правописни грешки"],exp:""},
 {topic:"Правопис",ref:"разказ",q:"В коя дума е допусната правописна грешка?",opts:["безсмислен","разсъмва","расказ","отчет"],a:2,exp:"Правилно е „разказ“: представката е раз-, а звучната „з“ се запазва в писмено, въпреки че пред „к“ се изговаря като „с“."},
 {topic:"Пълен член",q:"В кое изречение е допусната грешка при употребата на пълния член?",opts:["Ученикът реши задачата.","Учителя похвали класа.","Директорът влезе в стаята.","Конят препуска по полето."],a:1,exp:"„Учителят“ е подлог, затова е нужен пълен член (-ът/-ят)."},
 {topic:"Пунктуация",q:"В кое изречение е пропусната запетая?",opts:["Когато звънецът би учениците излязоха.","Той каза, че ще дойде.","Вали, но е топло.","Книгата, която прочетох, е интересна."],a:0,exp:"Подчиненото обстоятелствено изречение „Когато звънецът би“ се отделя със запетая от главното."},
 {topic:"Литература",q:"Кое произведение НЕ е на Христо Ботев?",opts:["„Хаджи Димитър“","„Обесването на Васил Левски“","„Моята молитва“","„Епопея на забравените“"],a:3,exp:"„Епопея на забравените“ е цикъл от Иван Вазов."},
 {topic:"Литература",q:"Кой е авторът на стихотворението „Колко си хубава!“?",opts:["Пейо Яворов","Христо Фотев","Димчо Дебелянов","Никола Вапцаров"],a:1,exp:"„Колко си хубава!“ е от Христо Фотев."},

 const ROLES=[["","— роля —"],["intro","Увод с теза"],["arg","Аргумент"],["concl","Извод"],["other","Друго"]];
 const getParas=()=>$("#txt").value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);

  $("#paras").innerHTML=ps.length?ps.map((p,i)=>{const t=tags[i]||{};return `<div class="para ${t.role?"r-"+t.role:""}">

   <div class="row"><select id="role${i}" aria-label="Роля на абзац ${i+1}">${ROLES.map(([v,l])=>`<option value="${v}"${t.role===v?" selected":""}>${l}</option>`).join("")}</select>

 const STOP=new Set("които която който което защото когато където между много може трябва неговата нейната своята своите този тази това тези".split(" "));
 const CONN=["освен това","от друга страна","следователно","затова","например","на първо място","на второ място","в заключение","въпреки","обаче","тоест","не на последно място","поради това","от една страна"];
 const metrics=()=>{const t=$("#txt").value,low=t.toLowerCase();
  const sents=(t.match(/[^.!?…]+[.!?…]+/g)||[]).map(s=>s.trim());
  const longS=sents.filter(s=>(s.match(/\S+/g)||[]).length>30);
  const freq={};(low.match(/\p{L}+/gu)||[]).forEach(w=>{if(w.length>=5&&!STOP.has(w))freq[w]=(freq[w]||0)+1});
  const rep=Object.entries(freq).filter(([,c])=>c>=4).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const conn=CONN.filter(c=>low.includes(c));
  const m=(good,title,detail)=>`<div class="metric ${good?"g":"b"}"><strong>${title}</strong><span>${detail}</span></div>`;
  if(IS)isAuto(t,low,sents,m);
  $("#metrics").innerHTML=!t.trim()?`<p class="muted">Показателите се изчисляват, докато пишеш.</p>`:
   m(!longS.length,`Дълги изречения: ${longS.length}`,longS.length?"Над 30 думи: „"+esc(longS[0].slice(0,70))+"…“ — раздели го.":"Няма изречения над 30 думи.")+
   m(!rep.length,`Повтарящи се думи: ${rep.length}`,rep.length?rep.map(([w,c])=>`${esc(w)} ×${c}`).join(", ")+" — потърси синоним.":"Няма думи, повторени 4 и повече пъти.")+
   m(conn.length>=3,`Свързващи изрази: ${conn.length}`,conn.length?conn.join(", ")+(conn.length<3?". Добави още между абзаците.":"."):"Няма. Свържи абзаците с „освен това“, „от друга страна“, „следователно“.")};

/* --- разбор на един ред (общ за Excel и формата) --- */
const LET={"А":0,"Б":1,"В":2,"Г":3,"A":0,"B":1,"C":2,"D":3,"а":0,"б":1,"в":2,"г":3,"a":0,"b":1,"c":2,"d":3};
const num=v=>{const n=Number(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:NaN};
const P={
 acc:r=>{const [k,v]=r;if(!/^\d{3,4}$/.test(k))return {err:"номерът на сметката трябва да е 3–4 цифри"};if(!v)return {err:"липсва наименование"};return {item:[k,v]}},
 bel:r=>{const [topic,type,q,a,b,c,d,ans,exp,model,crit,passage,ref]=r;if(!topic)return {err:"липсва тема"};if(!q)return {err:"липсва въпрос"};
  if(ref&&/^http/i.test(ref)&&!/^https:\/\//i.test(ref))return {err:"линкът за справка трябва да започва с https://"};
  const ps={...(passage?{passage}:{}),...(ref?{ref}:{})};
  if(/отвор|разшир|open/i.test(type)){if(!model)return {err:"липсва примерен отговор"};
   const criteria=(crit||"").split(/;|\n/).map(x=>x.trim()).filter(Boolean);
   return {item:{topic,type:"open",q,model,criteria:criteria.length?criteria:["Отговаря точно на въпроса","Подкрепя отговора с пример","Изразът е ясен и без грешки"],exp:exp||"",...ps}}}
  if(/кратък|свободен|text/i.test(type)){const answers=ans.split(";").map(x=>x.trim().toLowerCase()).filter(Boolean);
   if(!answers.length)return {err:"липсва верен отговор (няколко варианта се разделят с ;)"};return {item:{topic,type:"text",q,answers,exp:exp||"",...ps}}}
  const opts=[a,b,c,d];if(opts.filter(Boolean).length<2)return {err:"нужни са поне 2 отговора в колони А–Г"};
  const i=LET[ans.trim()];if(i===undefined)return {err:"верният отговор трябва да е А, Б, В или Г"};if(!opts[i])return {err:`отговор ${"АБВГ"[i]} е празен`};
  const keep=opts.map((o,j)=>[o,j]).filter(([o])=>o);return {item:{topic,q,opts:keep.map(([o])=>o),a:keep.findIndex(([,j])=>j===i),exp:exp||"",...ps}}},
 topics:r=>{const [kind,t,author,work]=r;if(!t)return {err:"липсва тема"};const isIS=/ис|интерпр/i.test(kind);if(!isIS&&!/есе/i.test(kind))return {err:"видът трябва да е „Есе“ или „ИС“"};
  return {item:{kind:isIS?"Интерпретативно съчинение":"Есе",t,...(isIS&&author?{author}:{}),...(isIS&&work?{work}:{})}}},
 cases:(r,acc)=>{const x=P.cases0(r,acc);if(x.item&&r[7])x.item.group=r[7];return x},
 cases0:(r,acc)=>{const [title,text,type,ent,ans,exp,tbl]=r;if(!title)return {err:"липсва заглавие"};if(!text)return {err:"липсва условие"};
  if(/таблиц|баланс|table/i.test(type)){const rows=[];for(const p of (tbl||"").split(/;|\n/).map(x=>x.trim()).filter(Boolean)){const m=p.match(/^(.+?)\s*=\s*(-?[\d\s.,]+)$/);
    if(!m)return {err:`редът „${p}“ не е във формат Позиция = сума`};const a=num(m[2]);if(isNaN(a))return {err:`сумата в „${p}“ не е число`};rows.push({label:m[1].trim(),amt:a})}
   if(!rows.length)return {err:"липсва таблица (формат: Позиция = сума; …)"};return {item:{title,type:"table",text,rows,exp:exp||""}}}
  if(/числ|num/i.test(type)){const n=num(ans);if(isNaN(n))return {err:"числовият отговор не е число"};return {item:{title,type:"num",text,answer:n,exp:exp||""}}}
  const parts=ent.split(/;|\n/).map(s=>s.trim()).filter(Boolean);if(!parts.length)return {err:"липсват статии (формат: 302/401 2000; 4531/401 400)"};
  const entries=[];for(const p of parts){const m=p.match(/^(\d{3,4})\s*\/\s*(\d{3,4})\s+([\d\s.,]+)$/);if(!m)return {err:`статията „${p}“ не е във формат Дт/Кт сума`};
   for(const k of [m[1],m[2]])if(!acc[k])return {err:`сметка ${k} липсва в листа „Сметки“`};const a=num(m[3]);if(!(a>0))return {err:`сумата в „${p}“ не е положително число`};entries.push({d:m[1],k:m[2],amt:a})}
  return {item:{title,text,entries,exp:exp||""}}}};
const HEAD={bel:["Тема","Тип (избор / кратък / отворена)","Въпрос","А","Б","В","Г","Верен отговор (буква; при кратък – варианти с ;)","Обяснение","Примерен отговор (отворена)","Критерии (отворена, с ;)","Текст към задачата (по желание)","Справка в kaksepishe.com (дума или линк)"],
 topics:["Вид (Есе / ИС)","Тема","Автор – фамилия (за ИС)","Ключова дума от заглавието (за ИС)"],
 cases:["Заглавие","Условие","Тип (статии / число / таблица)","Статии (Дт/Кт сума; …)","Числов отговор","Обяснение","Таблица (Позиция = сума; …)","Група (напр. казус „Алфа“ ООД)"],acc:["Номер","Наименование"]};
const toRow={bel:q=>{const t=q.type||"choice";return [q.topic,t==="text"?"кратък":t==="open"?"отворена":"избор",q.q,...(t==="choice"?[0,1,2,3].map(i=>q.opts[i]||""):["","","",""]),t==="text"?q.answers.join("; "):t==="choice"?"АБВГ"[q.a]:"",q.exp||"",t==="open"?q.model:"",t==="open"?q.criteria.join("; "):"",q.passage||"",q.ref||""]},
 topics:t=>[t.kind==="Есе"?"Есе":"ИС",t.t,t.author||"",t.work||""],
 cases:c=>{const t=c.type||"entries";return [c.title,c.text,t==="num"?"число":t==="table"?"таблица":"статии",t==="entries"?c.entries.map(e=>`${e.d}/${e.k} ${e.amt}`).join("; "):"",t==="num"?String(c.answer):"",c.exp||"",t==="table"?c.rows.map(r=>`${r.label} = ${r.amt}`).join("; "):"",c.group||""]},
 acc:([k,v])=>[k,v]};

const parseWB=(X,buf)=>{const wb=X.read(buf,{type:"array"}),out={},errs=[],skipped=[];
 const rows=n=>{const ws=wb.Sheets[n];if(!ws)return null;return X.utils.sheet_to_json(ws,{header:1,defval:"",raw:false}).slice(1).map((r,i)=>({r:Array.from({length:13},(_,j)=>String(r[j]??"").trim()),n:i+2})).filter(x=>x.r.some(Boolean))};
 for(const m of ["acc","bel","topics","cases"]){const rs=rows(SHEET[m]);if(rs===null){skipped.push(SHEET[m]);continue}
  if(!rs.length){errs.push(`Лист „${SHEET[m]}“ е празен. Изтрий листа, ако не искаш да го променяш.`);continue}
  const items=[];for(const {r,n} of rs){const x=P[m](r,out.acc||ACC);if(x.err)errs.push(`${SHEET[m]}, ред ${n}: ${x.err}`);else items.push(x.item)}
  out[m]=m==="acc"?Object.fromEntries(items):items}
 if(out.acc&&!out.cases)CASES.forEach(c=>(c.entries||[]).forEach(e=>{for(const k of [e.d,e.k])if(!out.acc[k]&&!errs.some(x=>x.includes(`сметка ${k} `)))errs.push(`Сметки: сметка ${k} се използва в казус „${c.title}“, но липсва в новия лист`)}));
 return {out,errs,skipped}};

const loadScript=src=>new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
const loadPdfJs=()=>window.__pjP||(window.__pjP=loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js")
 .then(()=>loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"))
 .then(()=>{const L=window.pdfjsLib;if(!L)throw 0;L.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";return L})
 .catch(e=>{window.__pjP=null;throw e}));
const readPdf=async(L,buf)=>{const doc=await L.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true}).promise,pages=[];
 for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i),tc=await pg.getTextContent();let line="",out=[],lastY=null;
  for(const it of tc.items){const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>2){out.push(line);line=""}line+=it.str;lastY=y;if(it.hasEOL){out.push(line);line="";lastY=null}}
  out.push(line);pages.push(out.map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean).join("\n"))}
 return {doc,pages}};
const pageImage=async(doc,i)=>{const pg=await doc.getPage(i),v1=pg.getViewport({scale:1}),sc=Math.min(2.5,Math.sqrt(1.2e6/(v1.width*v1.height))),vp=pg.getViewport({scale:sc});
 const cv=document.createElement("canvas");cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
 await pg.render({canvasContext:cx,viewport:vp}).promise;return new Promise(r=>cv.toBlob(r,"image/jpeg",.85))};

const AI_RULES=()=>`Ти помагаш на учител да прехвърли свой тест от PDF в приложение за подготовка за ДЗИ (БЕЛ) и за счетоводство. Извлечи задачите точно както са в теста.
Правила:
- Не измисляй нови задачи. Препиши условието и отговорите дословно, без номерацията им.
- БЕЛ задача с избор: "type":"choice", 2–4 отговора в "opts", верният като буква А, Б, В или Г в "answer". Задача с кратък свободен отговор: "type":"text", приемливите отговори в "answers" (малки букви).
- БЕЛ задача с разширен отговор (например текст от няколко изречения): "type":"open", "model" – примерен верен отговор, "criteria" – 3–5 кратки критерия за проверка. Ако в PDF файла има критерии или примерен отговор, използвай тях.
- Ако задачата се отнася за текст или откъс, сложи целия текст в "passage" на всяка задача към него (до 4000 знака), без да го съкращаваш.
- За задачи по правопис добави "ref" – правилно изписаната дума, за която се отнася задачата (напр. "разказ").
- "topic" е кратка тема: Правопис, Пунктуация, Граматика, Морфология, Лексика, Литература, Четене с разбиране и др.
- ВАЖНО: Когато счетоводен казус е списък от номерирани стопански операции (1., 2., 3. …) на едно предприятие, НЕ го връщай като един казус. Направи ОТДЕЛЕН казус за всяка операция: "title":"Оп. N. кратко описание" (напр. "Оп. 1. Покупка на материали"), "text" – условието на операцията дословно, а ако тя се позовава на друга операция ("сумата от оп. 1"), добави в скоби нужната сума, за да е разбираема самостоятелно; "entries" – само статиите на тази операция (с ДДС, себестойност и т.н.); "group" – името на предприятието (напр. "„Алфа“ ООД"). Общото условие (регистрация по ЗДДС, валута) добави в началото на "text" на първата операция.
- Счетоводен казус със статии: "type":"entries", всяка статия {"d":"дебит","k":"кредит","amt":число}; ползвай Националния сметкоплан (напр. 302, 401, 4531, 503). Казус с числов отговор: "type":"num", "answer":число. Казус с таблица за попълване (баланс, отчет за приходите и разходите и др.): "type":"table", "rows":[{"label":"позиция","amt":число}]. Сумите са числа без валута.
- Тема за есе или интерпретативно съчинение: в "topics", "kind":"Есе" или "ИС"; за ИС добави "author" (само фамилия) и "work" (ключова дума от заглавието).
- В "skipped" сложи само съдържание, което не е задача от горните видове, като {"what":"кратко описание","text":"пълният текст на задачата, ако е задача"}. Указания, точкуване и заглавия не са задачи.
- "fromKey": true само ако верният отговор (или примерният отговор и критериите) е посочен в PDF файла. Иначе реши задачата сам, "fromKey": false.
- "exp": едно-две изречения обяснение защо отговорът е верен, на български.
- Нужните сметки, които не са в списъка по-долу, добави в "accounts".
Сметки в приложението: ${Object.entries(ACC).map(([k,v])=>k+" "+v).join("; ")}
Отговори само с JSON:
{"bel":[{"topic":"","type":"choice","q":"","opts":["",""],"answer":"А","exp":"","passage":"","fromKey":true},{"topic":"","type":"open","q":"","model":"","criteria":[""],"fromKey":false}],"cases":[{"title":"","text":"","type":"entries","entries":[{"d":"","k":"","amt":0}],"exp":"","group":"","fromKey":true},{"title":"","text":"","type":"table","rows":[{"label":"","amt":0}],"exp":"","fromKey":true}],"topics":[{"kind":"Есе","t":""}],"accounts":[{"k":"","name":""}],"skipped":[{"what":"","text":""}]}
Празните групи остави като [].`;

const wireImp=()=>{const up=$("#pup");if(!up)return;$("label[for=pup]").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();up.click()}};
 if(IMP)renderImp();
 let ctl;$("#pstop").onclick=()=>ctl?.abort();
 up.onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const msg=$("#pmsg"),stopB=$("#pstop");
  const sample=await useCap("sample");if(!sample){msg.textContent="Разпознаването с Claude не е достъпно в този изглед.";return}

  let L,doc,pages;try{L=await loadPdfJs();({doc,pages}=await readPdf(L,await f.arrayBuffer()))}catch(err){msg.textContent="PDF файлът не можа да се прочете. Провери дали не е защитен с парола.";return}
  const scanned=pages.filter(p=>p.length>=40).length<Math.ceil(pages.length/2);let jobs=[];
  if(!scanned){const last=pages.length>1?pages[pages.length-1]:"";let cur=[],len=0;
   pages.forEach((p,i)=>{if(len+p.length>12000&&cur.length){jobs.push(cur);cur=[];len=0}cur.push(i);len+=p.length});if(cur.length)jobs.push(cur);
   jobs=jobs.map((ix,j)=>({text:ix.map(i=>`--- Страница ${i+1} ---\n${pages[i]}`).join("\n\n")+(jobs.length>1&&!ix.includes(pages.length-1)?`\n\n--- Последна страница (може да съдържа ключ с отговори; не извличай задачи от нея) ---\n${last}`:""),label:`страници ${ix[0]+1}–${ix[ix.length-1]+1}`}))}
  else{const lim=await sample.limits().catch(()=>null);if(!lim?.images){msg.textContent="Файлът е сканиран (без текст), а изпращането на изображения не е достъпно тук. Използвай PDF с текст.";return}
   const per=Math.max(1,Math.min(4,lim.images.maxCount));for(let i=1;i<=doc.numPages;i+=per)jobs.push({pages:Array.from({length:Math.min(per,doc.numPages-i+1)},(_,k)=>i+k),label:`страници ${i}–${Math.min(i+per-1,doc.numPages)}`})}
  ctl=new AbortController();stopB.hidden=false;up.disabled=true;
  const res={bel:[],cases:[],topics:[],accounts:[],skipped:[]};let failed=0;
  for(const [j,job] of jobs.entries()){msg.textContent=`Claude разпознава ${job.label}${jobs.length>1?` (част ${j+1} от ${jobs.length})`:""}… обикновено 30–90 секунди`;

    else{const imgs=[];for(const p of job.pages)imgs.push(await pageImage(doc,p));

    for(const k of Object.keys(res))if(Array.isArray(r?.[k]))res[k].push(...r[k])}
   catch(err){if(err?.code==="cancelled"){msg.textContent="Разпознаването е спряно.";break}
    if(["not_granted","sampling_disabled","images_unavailable"].includes(err?.code)){msg.textContent=err.code==="not_granted"?"Не е разрешено използването на Claude за тази страница.":"Claude не е достъпен за този акаунт или файл.";stopB.hidden=true;up.disabled=false;return}

    failed++}}

const splitCase=async(i,btn)=>{const c=CASES[i],sample=await useCap("sample"),msg=$("#pmsg");if(!sample||!msg){btn.textContent="Нужен е Claude";return}
 btn.disabled=true;btn.textContent="Разделям…";$("#pup")?.closest("section").scrollIntoView({behavior:"smooth",block:"start"});
 msg.textContent=`Claude разделя „${c.title}“ по операции… обикновено 30–90 секунди`;$("#pprev").innerHTML="";
 try{const r=await sample.json(AI_RULES()+`\n\nТова е вече въведен казус с общ списък статии. Раздели го на отделни казуси – по един за всяка номерирана операция – и разпредели дадените статии по операциите. Използвай САМО дадените статии и суми, не добавяй и не променяй статии. Ако статия не може да се свърже с операция, опиши я в "skipped". Задачите по БЕЛ и темите остави празни.\n\nЗаглавие: ${c.title}\nУсловие:\n"""\n${c.text}\n"""\nСтатии (Дт/Кт сума):\n${c.entries.map(e=>`${e.d}/${e.k} ${e.amt}`).join("\n")}`,{cache:false});
  r.cases=(r.cases||[]).map(x=>({...x,group:x.group||c.title,fromKey:true}));r.bel=[];r.topics=[];
  const used=r.cases.reduce((a,x)=>a+(x.entries||[]).length,0);
  finishImp(r,0,c.title,{title:c.title,text:c.text});
  msg.textContent=`„${c.title}“ → ${IMP.items.length} операции · ${used} от ${c.entries.length} статии разпределени${used!==c.entries.length?" – провери разликата":""}. След „Добави“ те заменят общия казус.`;renderImp()}
 catch(e){msg.textContent=e?.code==="not_granted"?"Не е разрешено използването на Claude за тази страница.":e?.code==="rate_limited"?"Достигнат е лимитът за използване на Claude. Опитай по-късно.":"Разделянето не успя. Опитай пак."}
 finally{btn.disabled=false;btn.textContent="Раздели по операции"}};
const finishImp=(res,failed,name,replace=null)=>{const acc={...ACC};(res.accounts||[]).forEach(a=>{const k=String(a?.k||"").trim();if(/^\d{3,4}$/.test(k)&&!acc[k]&&a.name)acc[k]=String(a.name)});
  const items=[];for(const m of ["bel","cases","topics"])for(const x of (res[m]||[])){const row=aiToRow[m](x).map(v=>String(v??"").trim()),p=P[m](row,acc);
   items.push({m,row,item:p.item,err:p.err,check:m!=="topics"&&x.fromKey===false,on:!p.err})}
  IMP={items,acc,skipped:(res.skipped||[]).filter(Boolean).map(x=>typeof x==="string"?{what:x,text:""}:{what:String(x.what||x.text||""),text:String(x.text||"")}),failed,file:name,replace}};

const renderImp=()=>{const box=$("#pprev");if(!box||!IMP)return;const {items,skipped,failed}=IMP,newAcc=Object.keys(IMP.acc).filter(k=>!ACC[k]);
 const nm={bel:"БЕЛ въпроси",cases:"Казуси",topics:"Теми за есе"};
 const sel=items.filter(x=>x.on&&!x.err),unchk=sel.filter(x=>x.check).length;
 box.innerHTML=`${failed?`<div class="fb no"><strong>${failed} ${failed===1?"част не беше разпозната":"части не бяха разпознати"}</strong>Качи файла отново или въведи липсващите задачи ръчно.</div>`:""}
  ${["bel","cases","topics"].filter(m=>items.some(x=>x.m===m)).map(m=>`<h2>${nm[m]}</h2>${items.map((x,i)=>x.m!==m?"":`<div class="erow imp${x.err?" bad":""}" id="ir${i}">
   <label class="chk" style="align-items:flex-start;flex:1 1 220px;min-width:0"><input type="checkbox" data-on="${i}"${x.on?" checked":""}${x.err?" disabled":""}>
    <span class="et">${x.item?label[m](x.item):esc(x.row[m==="topics"?1:m==="cases"?0:2]||"(празно)")}
     ${x.m==="bel"&&x.item&&!x.item.type?`<br><span class="muted" style="font-size:12.5px">Верен: ${"АБВГ"[x.item.a]}) ${esc(x.item.opts[x.item.a])}</span>`:""}
     ${x.check?`<br><span class="pill warn">Провери отговора – предложен от Claude</span>`:""}${x.err?`<br><span class="ferr" style="font-size:13px">${esc(x.err)}</span>`:""}</span></label>
   <button class="mini" data-ie="${i}">Редактирай</button></div>`).join("")}`).join("")}
  ${newAcc.length?`<p class="muted" style="font-size:13px">Нови сметки, които ще се добавят: ${newAcc.map(k=>`${k} ${esc(IMP.acc[k])}`).join(", ")}.</p>`:""}
  ${skipped.length?`<details open><summary>Пропуснато (${skipped.length})</summary><div class="stack" style="margin-top:8px">${skipped.map((s,i)=>`<div class="erow"><div class="et">${esc(s.what)}${s.text&&s.text!==s.what?`<br><span class="muted" style="font-size:12.5px">${esc(s.text.slice(0,200))}${s.text.length>200?"…":""}</span>`:""}</div><button class="mini" data-sk="${i}">Добави като отворена задача</button></div>`).join("")}</div></details>`:""}
  ${items.length?`<div class="row"><button class="btn" id="padd"${sel.length&&DB?"":" disabled"}>${IMP.replace?"Замени казуса с избраните":"Добави избраните"} (${sel.length})</button><button class="btn ghost" id="pcnl">Откажи</button></div>
  ${unchk?`<p class="muted" style="font-size:13px">${unchk} от избраните имат отговор, предложен от Claude. Провери ги преди добавяне.</p>`:""}`:""}`;
 box.querySelectorAll("[data-on]").forEach(c=>c.onchange=()=>{items[+c.dataset.on].on=c.checked;renderImp()});
 box.querySelectorAll("[data-ie]").forEach(b=>b.onclick=()=>impForm(+b.dataset.ie));
 box.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{const s=IMP.skipped.splice(+b.dataset.sk,1)[0],row=["Отворена задача","отворена",s.text||s.what,"","","","","","","","",""];
  IMP.items.push({m:"bel",row,item:null,err:"липсва примерен отговор",check:true,on:false});renderImp();impForm(IMP.items.length-1)});
 const cn=$("#pcnl");if(cn)cn.onclick=()=>{IMP=null;box.innerHTML="";$("#pmsg").textContent=""};
 const ad=$("#padd");if(ad)ad.onclick=async()=>{if(unchk&&!ad.dataset.sure){ad.dataset.sure=1;ad.textContent=`Добави въпреки ${unchk} непроверени`;return}
  ad.disabled=true;ad.textContent="Добавям…";
  try{const used=new Set();sel.forEach(x=>x.m==="cases"&&(x.item.entries||[]).forEach(e=>{used.add(e.d);used.add(e.k)}));
   const addAcc=[...used].filter(k=>!ACC[k]);if(addAcc.length)await saveM("acc",{...ACC,...Object.fromEntries(addAcc.map(k=>[k,IMP.acc[k]]))});
   const rep=IMP.replace;
   for(const m of ["bel","cases","topics"]){const add=sel.filter(x=>x.m===m).map(x=>x.item);if(!add.length)continue;
    let base=getM(m);if(m==="cases"&&rep){const k=base.findIndex(c=>c.title===rep.title&&c.text===rep.text);if(k>=0){base=base.slice();base.splice(k,1,...add);await saveM(m,base);continue}}
    await saveM(m,[...base,...add])}
   IMP=null;box.innerHTML=`<div class="fb ok"><strong>Добавено</strong>${sel.length} записа са добавени към материалите${IMP&&IMP.replace?"":""}.</div>`;$("#pmsg").textContent=""}
  catch(err){ad.disabled=false;ad.textContent=`Добави избраните (${sel.length})`;$("#pmsg").textContent="Добавянето не успя. Провери връзката и опитай пак."}}};

const impForm=i=>{const x=IMP.items[i],row=$("#ir"+i);const fs=$("#fslot");if(fs)fs.innerHTML="";view.querySelectorAll(".eform.ie").forEach(f=>f.remove());formOpen=true;
 const f=document.createElement("div");f.className="eform ie";f.innerHTML=`${FORM[x.m](x.row)}<p id="ferr" class="ferr" hidden></p><div class="row"><button class="btn" id="fsave">Запази</button><button class="btn ghost" id="fcnl">Откажи</button></div>`;
 row.after(f);formVis(f,x.m);f.scrollIntoView({block:"nearest",behavior:"smooth"});
 $("#fcnl").onclick=()=>{f.remove();formOpen=false};
 $("#fsave").onclick=()=>{const r=readForm(x.m),p=P[x.m](r,IMP.acc);
  if(p.err){const e=$("#ferr");e.hidden=false;e.textContent="Поправи: "+p.err;return}
  Object.assign(x,{row:r,item:p.item,err:null,check:false,on:true});formOpen=false;renderImp()}};

/* --- зареждане от хранилището --- */
const tStatText=fromT=>fromT?W(`Учениците виждат качените материали${updatedAt?" · последна промяна "+new Date(updatedAt).toLocaleString("bg-BG",{dateStyle:"short",timeStyle:"short"}):""}.`,"Използват се материалите, заредени на това устройство."):W("Учениците виждат примерните материали. Качи свои или редактирай тези.","Използват се вградените материали. Можеш да заредиш Excel файл от учителя.");
const tStat=()=>{const fromT=Object.values(fromTeacher).some(Boolean),a=$("#tstat"),c=$("#tcnt"),r=$("#rst");if(!a)return;
 a.textContent=tStatText(fromT);
 c.textContent=`${BEL.length} БЕЛ въпроса · ${TOPICS.length} теми · ${CASES.length} казуса · ${Object.keys(ACC).length} сметки`;if(r&&!r.dataset.sure)r.disabled=!fromT};
const refresh=()=>{clampIdx();if(curView==="teacher"){if(!EDITOR)return;tStat();if(!formOpen)renderList()}else if(curView!=="essay")V[curView]()};
Promise.all([useCap("db"),useCap("user")]).then(async([db,user])=>{DB=db;
 EDITOR=!!(user&&await user.canEdit().catch(()=>false));if(EDITOR&&!formOpen&&curView!=="essay")V[curView]();
 if(!db)return;
 db.collection("content").onSnapshot(snap=>{const got={};snap.docs.forEach(d=>{if(d.exists)got[d.id]=d.data()});let changed=false;
  for(const m of ["bel","topics","cases","acc"]){const v=got[m]?.items??DEF[m];fromTeacher[m]=!!got[m];
   if(JSON.stringify(v)!==JSON.stringify(getM(m))){putM(m,JSON.parse(JSON.stringify(v)));changed=true}}
  updatedAt=Math.max(0,...Object.values(got).map(x=>x.updatedAt||0))||null;
  if(changed||curView==="teacher")refresh()},()=>{});
});

/* ---------- навигация ---------- */
function go(v){if(!V[v])v="home";curView=v;if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);
 document.querySelectorAll(".tab").forEach(t=>t.toggleAttribute("aria-current",false)||t.dataset.v===v&&t.setAttribute("aria-current","page"));
 document.querySelectorAll("#stem b").forEach(b=>b.classList.toggle("on",STEMMAP[v].includes(b.dataset.s)));
 V[v]();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||"home");
</script>

<script>if("serviceWorker" in navigator&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body></html>
